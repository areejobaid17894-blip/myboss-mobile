name: myboss_mobile
description: my boss app — Employee Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: 3.35.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # Localization
  intl: any

  # Routing
  go_router: ^15.1.2

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

  # TODO(orange-firebase): Enable after adding Orange Firebase config files + flutterfire configure.
  # Push notifications (enable with --dart-define=PUSH_ENABLED=true)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
